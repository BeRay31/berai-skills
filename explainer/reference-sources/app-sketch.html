<style data-slot="page-css">

   The app-shell CSS provides structural styles (topbar, portal, buttons, etc.).
   These styles add: evidence panel content, match-rate callout, field cards. */

.match-rate strong{color:var(--warning)}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px}

.fact-list li,.assump-list li{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.85rem}

.fact-list .big{font-size:1.2rem;font-weight:700;color:var(--success);display:block}

.cmp-table th{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.cmp-table td:first-child{color:var(--text-dim);font-weight:500}
.cmp-table td:nth-child(2){color:var(--text-faint)}
.cmp-table td:nth-child(3){color:var(--accent)}

.decision{padding:14px 18px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent-dim)}
.decision h4{color:var(--accent);margin-top:0;font-family:var(--sans);font-size:.95rem}
.decision p{font-size:.88rem;color:var(--text-dim);line-height:1.55}

/* Expense item card */
.expense-card{padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);margin-top:4px}

<script data-slot="page-js">
/* State machine for the expense approval app sketch.
   The app-shell JS handles theme toggle, tab switching, info panel, and reset.
   This page-js provides: portal data, state machine, render logic, time stats.

   Hooks:
   - window.onSketchReset: called by the reset button (app-shell.js)
*/
(function(){
  "use strict";

  var stateOrder = ['submit','review','approved','flagged','resolved'];
  var approvedPath = ['submit','review','approved','resolved'];
  var flaggedPath = ['submit','review','flagged','resolved'];
  var current = 'submit';
  var branch = 'approved';

  var data = {
    submit: {
      proposed:{status:'Draft',statusKind:'neutral',title:'Submit expense report',
        body:'Team lunch with 3 attendees. Total: $87.50. Under the $500 auto-approval threshold.',
        expenses:[
          {name:'Restaurant receipt',amount:'$87.50',tag:'compliant',tagText:'Under threshold'}
        ]},
      baseline:{status:'Draft',statusKind:'neutral',title:'Submit expense report',
        body:'Team lunch with 3 attendees. Total: $87.50. Submitted to manager for review.',
        expenses:[
          {name:'Restaurant receipt',amount:'$87.50',tag:'compliant',tagText:'Submitted'}
        ]},
      actions:[{label:'Submit for review',to:'review',kind:'primary'}],
      time:{proposed:'—',baseline:'—',proposedSub:'draft',baselineSub:'draft'}
    },
    review: {
      proposed:{status:'Policy check',statusKind:'neutral',title:'Policy engine evaluating',
        body:'Checking receipt against policy rules: amount limit, category match, duplicate detection.',
        trustQuestion:'The policy engine approved this expense automatically. Do you want to keep auto-approval enabled?',
        expenses:[
          {name:'Restaurant receipt',amount:'$87.50',tag:'compliant',tagText:'Auto-approved'}
        ]},
      baseline:{status:'In queue',statusKind:'neutral',title:'Waiting for manager review',
        body:'Your expense is in the manager review queue. Average wait time: 4.2 days.',
        aside:'QUEUE POSITION\n3 of 12\n\nESTIMATED WAIT\n4–5 days'},
      proposedActions:[{label:'Continue',to:'approved',kind:'primary'}],
      baselineActions:[
        {label:'Approve',to:'approved',kind:'success'},
        {label:'Flag for review',to:'flagged',kind:'danger'}
      ],
      time:{proposed:'—',baseline:'—',proposedSub:'checking policy',baselineSub:'in queue'},
    },
    approved: {
      proposed:{status:'Approved',statusKind:'success',title:'Expense auto-approved',
        body:'The policy engine confirmed compliance. Reimbursement scheduled for next pay cycle.',
        aside:'APPROVED BY\nPolicy engine\n\nTIME\n< 30 seconds\n\nPOLICY CHECKS\nAmount: pass\nCategory: pass\nDuplicate: pass'},
      baseline:{status:'Approved',statusKind:'success',title:'Expense approved by manager',
        body:'Your manager reviewed and approved the expense. Reimbursement scheduled for next pay cycle.',
        aside:'APPROVED BY\nManager\n\nTIME\n4.2 days avg'},
      actions:[],
      time:{proposed:'< 30 sec',baseline:'4.2 days',proposedSub:'policy engine',baselineSub:'manager review'}
    },
    flagged: {
      proposed:{status:'Flagged',statusKind:'warning',title:'Flagged for manager review',
        body:'The policy engine flagged this expense. The manager reviews only the flagged item, not the full report.',
        aside:'FLAGGED BY\nPolicy engine\n\nREASON\nReceipt image unclear\n\nMANAGER QUEUE\n1 item only'},
      baseline:{status:'Rejected',statusKind:'error',title:'Expense rejected',
        body:'Your manager rejected the expense. Correct the issue and resubmit the full report.',
        aside:'REJECTED BY\nManager\n\nREASON\nReceipt image unclear\n\nRESUBMIT\nFull report again'},
      actions:[{label:'Manager approves',to:'resolved',kind:'primary'}],
      time:{proposed:'2–4 hours',baseline:'5–8 days',proposedSub:'exception only',baselineSub:'reject + resubmit'}
    },
    resolved: {
      proposed:{status:'Resolved',statusKind:'success',title:'Flagged item approved',
        body:'The manager approved the flagged item. Reimbursement scheduled.',
        aside:'APPROVED BY\nManager\n\nTIME\n2–4 hours'},
      baseline:{status:'Resubmitted',statusKind:'warning',title:'Expense resubmitted',
        body:'Corrected expense is back in the review queue.',
        aside:'TIME\n4–5 more days'},
      actions:[],
      time:{proposed:'2–4 hours',baseline:'9–13 days',proposedSub:'resolved',baselineSub:'reject + resubmit + review'}
    }
  };

  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}

  function renderPortal(portalKey,stateKey){
    var d=data[stateKey][portalKey];
    var bodyEl=document.getElementById(portalKey+'Body');
    var footEl=document.getElementById(portalKey+'Foot');
    bodyEl.innerHTML='';footEl.innerHTML='';

    var main=el('div','body-main');
    var sr=el('div','status-row');
    sr.appendChild(el('span','flag '+d.statusKind,d.status));
    main.appendChild(sr);
    main.appendChild(el('h2','body-title',d.title));
    main.appendChild(el('p','body-desc',d.body));

    // Expense items
    if(d.expenses){
      var ec=el('div','expense-card');
      d.expenses.forEach(function(exp){
        var row=el('div','expense-row');
        row.appendChild(el('span','expense-name',exp.name));
        row.appendChild(el('span','expense-amount',exp.amount));
        row.appendChild(el('span','expense-tag '+exp.tag,exp.tagText));
        ec.appendChild(row);
      });
      main.appendChild(ec);
    }

    // Trust question
    if(d.trustQuestion){
      var tq=el('div','trust-q');
      tq.appendChild(el('div','trust-q-label',d.trustQuestion));
      var btns=el('div','status-row');
      var yesBtn=el('button','btn success','Yes, keep auto-approval');yesBtn.type='button';
      var noBtn=el('button','btn danger','No, require manual review');noBtn.type='button';
      yesBtn.addEventListener('click',function(){goTo('approved');});
      noBtn.addEventListener('click',function(){
        tq.innerHTML='';
        tq.appendChild(el('div','trust-q-label','You chose to require manual review. This will be logged as a trust signal.'));
        tq.appendChild(el('div','trust-q-hint','In the pilot, this data point answers: do managers trust the policy engine?'));
        goTo('flagged');
      });
      btns.appendChild(yesBtn);
      btns.appendChild(noBtn);
      tq.appendChild(btns);
      tq.appendChild(el('div','trust-q-hint','In the pilot, your choice here answers: do managers trust the policy engine?'));
      main.appendChild(tq);
    }

    // Aside
    if(d.aside){
      var grid=el('div','body-grid');
      grid.appendChild(main);
      grid.appendChild(el('div','aside',d.aside));
      bodyEl.appendChild(grid);
    } else {
      bodyEl.appendChild(main);
    }

    // Footer actions
    var actions = data[stateKey][portalKey+'Actions'] || data[stateKey].actions;
    var path = branch === 'flagged' ? flaggedPath : approvedPath;
    var stepIdx = path.indexOf(stateKey) + 1;
    var stepTotal = path.length;
    if(actions.length>0){
      footEl.appendChild(el('span','foot-label','Next step'));
      actions.forEach(function(a){
        var b=el('button','btn '+a.kind,a.label);b.type='button';
        b.addEventListener('click',function(){goTo(a.to);});
        footEl.appendChild(b);
      });
    } else {
      footEl.appendChild(el('span','foot-label','Flow complete'));
      var done=el('button','btn done','Reset');done.type='button';
      done.addEventListener('click',function(){goTo('submit');});
      footEl.appendChild(done);
    }
    footEl.appendChild(el('span','step-ind','Step '+stepIdx+' of '+stepTotal));
  }

  function updateTime(stateKey){
    var t=data[stateKey].time;
    document.getElementById('proposedTime').textContent=t.proposed;
    document.getElementById('baselineTime').textContent=t.baseline;
    var pts=document.getElementById('proposedTS'),bts=document.getElementById('baselineTS');
    pts.classList.toggle('accent',t.proposed!=='—');
    bts.classList.toggle('warn',t.baseline!=='—');
  }

  function goTo(stateKey){
    if(stateKey==='approved') branch='approved';
    if(stateKey==='flagged') branch='flagged';
    current=stateKey;
    renderPortal('proposed',stateKey);
    renderPortal('baseline',stateKey);
    updateTime(stateKey);
  }

  // Reset hook — called by app-shell.js when the reset button is clicked
  window.onSketchReset=function(){goTo('submit');};

  // Initialize
  goTo('submit');
})();
</script>
